# collector-server 容器编排
#
# 数据库：named volume collector-data → /data。不进镜像、不经 bind mount——
# 2026-08-24 教训：bind mount 走 virtiofs，SQLite WAL 的 mmap(-shm) 跨虚拟机共享
# 一致性有缺陷，宿主机进程直触挂载库（哪怕只读）两次引发 SQLITE_CORRUPT（丢当日数据）。
# named volume 数据落在 Docker VM 磁盘、容器直通，宿主机不存在该文件——误操作路径物理封死。
# 查生产库一律走 server HTTP/CLI 或 docker exec collector-server node -e '...'。
#
# 备份：server 内置每小时容器内 VACUUM INTO /data/backups/（滚动 24 份）；
# 导出到宿主：node scripts/backup-export.mjs（docker cp）。
#
# 一次性迁移（bind mount → volume，2026-08-24 已执行）：
#   docker compose down
#   docker run --rm -v collector-data:/dst -v "$(pwd)/data:/src" alpine \
#     sh -c 'cp /src/bilibili-collector.db /dst/ && ls -la /dst'
#   （停机状态下拷贝，WAL/-shm 不拷——重启后如有残留再补）
#   改本文件挂载 → docker compose up -d --build → pnpm verify:deployed
#
# 启动：docker compose up -d --build
# 看 TOKEN 等可在仓库根放 .env，或直接 export。

services:
  collector:
    build:
      context: .
      dockerfile: Dockerfile
    image: collector-server:latest
    container_name: collector-server
    restart: unless-stopped
    ports:
      - "21527:21527"
    environment:
      COLLECTOR_PORT: "21527"
      COLLECTOR_HOST: "0.0.0.0"
      # ⚠️ 生产必改！生成：node -e "console.log(require('crypto').randomBytes(24).toString('hex'))"
      # 设置后：扩展的 server URL 须带 ?token=xxx（popup 服务器配置里填完整 URL），CLI 须带 Bearer token。
      COLLECTOR_TOKEN: ${COLLECTOR_TOKEN:-change-me-collector-token}
      # 从宿主 localhost（经 -p 映射）访问无需填；从局域网 IP/主机名访问则填上，逗号分隔。
      COLLECTOR_ALLOWED_HOSTS: ${COLLECTOR_ALLOWED_HOSTS:-}
    volumes:
      - collector-data:/data

volumes:
  collector-data:
